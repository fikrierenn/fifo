  fifo_sifir_maliyet_bekcisi:
    uses: [entities:BKMMaliyet.dbo.FifoKatman, entities:BKMMaliyet.dbo.FifoCikisDetay]
    type: rule
    note: >-
      `fifo-domain.md` §6 "FİYAT 0 OLAMAZ" diyor. Bu kuralı korumakla görevli iki CHECK
      constraint canlıda DENETLENDİ ve İKİSİ DE KURALI KORUMUYOR. Veri bugün temiz olduğu
      için sorun GÖRÜNMÜYOR — ama tekrarını engelleyen bir şey YOK.
    measurement: >-
      2026-09-11 (BT-FIKRI · BKMMaliyet): (a) `CK_FifoKatman_BirimMaliyet` VAR, `is_disabled=0`,
      `is_not_trusted=0` — yani etkin ve güvenilir; AMA tanımı **`([BirimMaliyet]>=(0))`**,
      yani SIFIRA İZİN VERİYOR. Kural sıfırı YASAKLIYOR. (b)
      `CK_FifoCikisDetay_BirimMaliyet` **HİÇ YOK** (`sys.check_constraints`ta 0 kayıt) —
      çıkış tarafı hiç korunmuyor. (c) Bugünkü veri TEMİZ: `FifoKatman` 0 satır ve
      `FifoCikisDetay` 0 satır `BirimMaliyet <= 0`.
    rule: >-
      Bekçinin VARLIĞI kuralın KORUNDUĞU anlamına gelmez — tanımı da okunmalı. "Constraint
      var mı?" diye İSİMLE sormak yetersizdir; `definition` + `is_disabled` + `is_not_trusted`
      ÜÇÜ BİRDEN bakılır. Bu kayıt tam da o yüzden var: iki değişmez (`katman-constraint-siki-ve-guvenilir`,
      `cikis-constraint-siki-ve-guvenilir`) bunu soruyor ve İKİSİ DE KIRMIZI.
    details: >-
      Bu depoda 14 değişmez YAZILIYDI ama HİÇ KOŞMUYORDU: `degismezler.json` kök anahtarı
      `degismezler`, motor `invariants` okuyor; alan adları da Türkçeydi (`soru`/`neden`/
      `karsilastirma`). Anahtarlar İngilizceye çevrilip `sema/_project.yaml` ile `yerel`
      sunucu (BT-FIKRI, Integrated Security) beyan edilince 14'ü de koştu — 12 OK, 2 KIRIK.
      README'nin kendi teşhisi ("yazılı kural kimse tarafından koşturulmuyor") bu depoda da
      geçerliymiş.
      2026-09-11 KAPANDI. `v2-production/01_SIFIR_MALIYET_KAPISI.sql` koşturuldu (master'ın 83-127 ve 256-284 satırlarının BİREBİR kopyası — ayrı dosya, çünkü master 4752 satır ve o an commit'siz 478+/202- değişiklik taşıyordu; §6 kapısını kapatmak için 27 objeyi deploy etmek gerekmiyordu). SONUÇ ÖLÇÜLDÜ: iki tabloda da `CK_*_BirimMaliyet` artık `([BirimMaliyet]>(0))`, `is_disabled=0`, `is_not_trusted=0`. `sema kostur` → 14 değişmez, **0 KIRIK** (önce 2 idi). Bekçinin gevşek olması bir kaza değildi: HEAD'deki (commit'li) master `CHECK (BirimMaliyet >= 0)` yazıyordu ve DB tam da onunla uyumluydu. Sıkılaştırma (`> 0`) çalışma kopyasında YAZILMIŞ ama ne commit edilmiş ne deploy edilmişti. Yani 'DB script'ten geri kalmış' değil, 'düzeltme hiç uygulanmamış'. ⚠ 00_V2_MASTER_FULL.sql'deki bu değişiklik HÂLÂ COMMIT'Lİ DEĞİL — commit'lenmezse sonraki temiz kurulum gevşek constraint'i geri getirir. ⚠ Bu düzeltme sırasında DROP çalıştı, ADD ortam izniyle engellendi ve tablolar bir süre BEKÇİSİZ kaldı. DROP+ADD ayrı izin gerektirebiliyor; doğrusu ikisini tek script/batch olarak koşturmaktı — nitekim çözüm de öyle geldi.
