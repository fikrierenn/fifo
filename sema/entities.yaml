  BKMMaliyet.dbo.FifoKatman:
    type: table
    pk: KatmanId
    key: [StkId, GirisTarihi, KaynakTip, GirisMiktar, KalanMiktar, BirimMaliyet, Durum]
    grain: "ürün × giriş katmanı (FIFO maliyet havuzu, mekan-bağımsız PARTITION BY StkId)"
    note: "Eldeki birim maliyet = SUM(KalanMiktar*BirimMaliyet)/SUM(KalanMiktar) WHERE KalanMiktar>0. `KaynakTip` kümesi `kaynaktip-kumesi-kapali` değişmeziyle korunuyor."
    measurement: "2026-09-11 (yerel): 658.518 katman. KaynakTip dağılımı — ACILIS 567.675 / 375,9M ₺ · ALIS 53.781 / 52,5M · ACILIS_TAMAMLA 35.750 / 51,9M · IADE 707 / 165K · AYLIK_DEVIR 605 / 49K."
    confidence: 1.0
    evidence: "2026-09-11 — yerel BKMMaliyet sayımı."
    last_verified: "2026-09-11"

  BKMMaliyet.dbo.FifoCikisDetay:
    type: table
    pk: CikisId
    key: [StkId, HareketTarihi, HareketTipi, MekanId, KatmanId, Miktar, BirimMaliyet, CikisTutar, SatisTutar]
    grain: "satış/iade çıkış × tüketilen katman segmenti"
    note: "marj = SatisTutar (gelir) − CikisTutar (SMM). `CikisTutar` COMPUTED = Miktar×BirimMaliyet (UPDATE edilemez). ⚠ `BirimMaliyet` üzerinde CHECK constraint YOK — bkz. entities:fifo_sifir_maliyet_bekcisi."
    confidence: 1.0
    evidence: "2026-09-11 — yerel BKMMaliyet sys.check_constraints taraması + değişmez koşumu."
    last_verified: "2026-09-11"
