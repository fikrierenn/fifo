# Yol deseni | danisman | alan anahtari
#
# Belinza'dan uyarlandi. MEKANIZMA TASINABILIR, ESLEME PROJEYE OZEL.
# Ilk eslesen kazanir — ozel desenler yukarida, fallback en altta.
#
# Amac: bir alana BU OTURUMDA ILK dokunusta ilgili danismani zorla
# (`calisma-protokolu.md` adim 1: DANIS -> YAP -> KONTROL ETTIR -> SMOKE).
#
# ==== BEL'DE OLCULEN UC KUSUR — burada tekrarlanmasin ====
#   1. ISARETLER TEMIZLENMIYORDU -> kapi "bu oturumda ilk dokunus" iddia
#      ediyor ama isaret kaliciydi. Cozum: session-start.sh siliyor.
#   2. KAPSAM DARDI (yalniz panel/) -> en kritik kararlar disarida kaldi.
#      Burada kapsam: v2-production/ + tools/ + hangfire/ + .claude/hooks/.
#   3. ESLEME VAR OLMAYAN AJANLARA ISARET EDIYORDU -> kapi atesLENSE bile
#      yonlendirdigi yer bostu. Her ad `ls .claude/agents/` ile dogrulanir.
#
# DOGRULAMA (2026-09-10): asagidaki uc danismanin ucu de
# .claude/agents/ altinda MEVCUT.

# --- CONSTRAINT / DEGISMEZ / KAPI / HOOK -> kapi danismani ---
# En pahali sinif: ateslenmeyen ya da totolojik kapi. Bu oturumda dort kez
# odendi (gevsek CHECK, dar grep deseni, oz-gecersiz canary, set -e altinda
# sessizce olen grep).
\.claude/hooks/                        | fifo-kapi-danismani     | kapi
\.claude/commands/fifo-dogrula\.md     | fifo-kapi-danismani     | kapi
v2-production/01_V2_Tables\.sql        | fifo-kapi-danismani     | kapi
v2-production/18_V2_DonemKontrol\.sql  | fifo-kapi-danismani     | kapi

# --- DEPLOY / MASTER / BUILD / RESET -> deploy danismani ---
# plan-first sinyal 1: uretimde calisacak script veri kaybettirmez.
v2-production/00_V2_MASTER_FULL\.sql   | fifo-deploy-danismani   | deploy
v2-production/01a_V2_Tables_RESET\.sql | fifo-deploy-danismani   | deploy
tools/build-master\.sh                 | fifo-deploy-danismani   | deploy
tools/.*\.ps1$                         | fifo-deploy-danismani   | deploy

# --- MALIYET MANTIGI: tier, fallback, devre-disi, ortalama -> fifo danismani ---
# Bu deponun en pahali karar sinifi: bir urunun maliyeti sessizce baska
# yerden gelmeye baslar (1-TL sabit vakasi: Ocak +1,37M).
v2-production/02_V2_CoreProcedures\.sql        | fifo-danisman | maliyet-mantigi
v2-production/14_V2_AcilisOptimize\.sql        | fifo-danisman | maliyet-mantigi
v2-production/04_V2_SentetikFallback\.sql      | fifo-danisman | maliyet-mantigi
v2-production/12_V2_OrtalamaAylikMaliyet\.sql  | fifo-danisman | maliyet-mantigi
v2-production/1[567]_V2_.*\.sql                | fifo-danisman | maliyet-mantigi
v2-production/19_V2_DevreDisi_Fallback_Seed\.sql | fifo-danisman | maliyet-mantigi

# --- FALLBACK — en genis, en sonda ---
# YALNIZ kod. docs/, raporlar/, *.md GATE'lenmez: kod degil, gate'lemek
# surtunme uretir, ciktiyi degistirmez.
v2-production/.*\.sql$                 | fifo-danisman           | sql-genel
hangfire/.*\.cs$                       | fifo-deploy-danismani   | pipeline
